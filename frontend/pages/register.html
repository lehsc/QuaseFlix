<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro QuaseFlix</title>
<link rel="stylesheet" href="../styles/global.css">
<link rel="stylesheet" href="../styles/auth.css">
<style>[hidden]{display:none!important}label{display:block;margin:12px 0}.form-feedback,.field-error{color:#ffb3b3;margin:12px 0;line-height:1.4}.field-error{display:block;margin:4px 0 0}.form-input.input-error,.form-input.input-error:focus{border-color:#ff6969;box-shadow:0 0 0 1px #ff6969}.btn:disabled{opacity:.55;cursor:not-allowed}</style>
</head>
<body>
<main class="auth-main">
<div class="auth-card">
<h1>Criar conta</h1>
<p>Demonstração: e-mails e pagamentos simulados. Nenhuma cobrança real.</p>
<p id="status" role="alert" class="form-feedback">
</p>
<form id="start">
<label>E-mail<input name="email" type="email" required class="form-input">
</label>
<button type="submit" class="btn btn-primary btn-lg btn-block">Enviar código</button>
</form>
<div id="google">
</div>
<button id="google-unavailable" type="button" class="btn btn-primary btn-lg btn-block" disabled>Continuar com Google</button>
<p id="google-status" class="form-feedback" role="status"></p>
<form id="verify" hidden>
<p>Consulte o código na caixa de saída local indicada no README.</p>
<label>Código<input name="code" required pattern="[0-9]{6}" class="form-input">
</label>
<button type="submit" class="btn btn-primary btn-lg btn-block">Verificar</button>
</form>
<form id="complete" hidden>
<label>Nome completo<input name="full_name" required class="form-input">
</label>
<label>Senha (10 caracteres, letras e números)<input name="password" type="password" minlength="10" maxlength="128" required class="form-input">
</label>
<label>CPF<input name="cpf" required class="form-input">
</label>
<label>Nascimento<input name="birth_date" type="date" required class="form-input">
</label>
<label>Telefone (opcional)<input name="phone" class="form-input">
</label>
<label>Endereço<input name="address" minlength="5" required class="form-input">
</label>
<label>Plano<select name="plan_id" required class="form-input">
</select>
</label>
<p>Seu período gratuito de 30 dias começa ao finalizar.</p>
<label>Pagamento<select name="type" class="form-input">
<option value="boleto">Boleto simulado</option>
<option value="credit_card">Cartão de teste</option>
</select>
</label>
<fieldset id="card" hidden>
<legend>Use somente dados de teste</legend>
<label>Número<input name="card_number" class="form-input">
</label>
<label>Titular<input name="holder_name" class="form-input">
</label>
<label>CVC<input name="cvc" type="password" class="form-input">
</label>
<label>Mês<input name="expiration_month" type="number" min="1" max="12" class="form-input">
</label>
<label>Ano<input name="expiration_year" type="number" class="form-input">
</label>
</fieldset>
<p id="complete-status" class="form-feedback" role="alert"></p>
<button type="submit" class="btn btn-primary btn-lg btn-block">Finalizar cadastro</button>
</form>
<button id="restart" type="button" class="btn btn-secondary btn-lg btn-block">Recomeçar</button>
<p>
<a href="login.html">Entrar</a>
</p>
</div>
</main>
<script src="../scripts/register.js">
</script>
</body>
</html>
