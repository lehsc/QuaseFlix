<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assinatura — QuaseFlix</title>
<link rel="stylesheet" href="../styles/global.css"><link rel="stylesheet" href="../styles/auth.css">
<style>[hidden]{display:none!important}label{display:block;margin:12px 0}table{width:100%;margin:20px 0}td,th{padding:8px;text-align:left}button{margin:8px 0}</style>
</head>
<body><main class="auth-main"><div class="auth-card">
<h1>Minha assinatura</h1><p>Pagamentos e e-mails simulados. Nenhuma cobrança real.</p>
<p id="message" role="status"></p>
<form id="management-login">
<p>Entre para gerenciar a assinatura, inclusive se estiver cancelada ou com débitos.</p>
<label>E-mail<input class="form-input" type="email" name="email" required></label>
<label>Senha<input class="form-input" type="password" name="password" required></label>
<button class="btn btn-primary">Entrar</button></form>
<section id="subscription" hidden>
<p id="summary"></p><p id="outstanding"></p>
<table><thead><tr><th>Valor</th><th>Vencimento</th><th>Situação</th></tr></thead><tbody id="invoices"></tbody></table>
<label>Forma de pagamento<select class="form-input" id="payment-method"></select></label>
<button id="add-boleto">Adicionar boleto simulado</button>
<button id="pay">Confirmar pagamento simulado dos débitos</button>
<button id="cancel">Cancelar assinatura</button>
<button id="restore">Restaurar conta</button>
<button id="logout">Sair</button>
<p><a href="login.html">Voltar ao login</a></p>
</section></div></main>
<script src="../scripts/subscription.js"></script></body></html>
