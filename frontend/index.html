<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuaseFlix Brasil - Assistir a séries online, assistir a filmes online</title>
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/landing.css" />
</head>
<body>
  <div class="hero-wrapper">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <a href="index.html" class="brand-logo" aria-label="Página inicial do QuaseFlix">
        QUASEFLIX
      </a>
      <nav class="nav-actions">
        <a href="./pages/login.html" class="btn btn-primary btn-sm">Entrar</a>
      </nav>
    </header>

    <!-- Main Hero Call-To-Action -->
    <main class="hero-content">
      <h1 class="hero-title">Filmes, séries e muito mais, sem limites</h1>
      <p class="hero-subtitle">A partir de R$ 25,90. Cancele quando quiser.</p>
      
      <div class="cta-container">
        <button type="button" id="btn-create-account" class="btn btn-primary btn-lg">
          <span>Crie a sua conta</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </main>

    <!-- Bottom Glowing Curved Divider -->
    <div class="curve-divider" aria-hidden="true"></div>
  </div>

  <script src="./scripts/landing.js"></script>
</body>
</html>
